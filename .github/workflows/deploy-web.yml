name: Deploy web to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-web.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream God's Eye View v0.3.0
        run: git clone --depth 1 --branch v0.3.0 https://github.com/bilawalsidhu/gods-eye-view.git web

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          # Pages serves the site under /mrai-gods-eye/, not the domain root.
          # With the default base '/', /assets/*.js and /cesium/Cesium.js
          # 404'd and the globe never started (white page, frames 0/0).
          # base=/mrai-gods-eye/ was tried next and also failed: the Cesium
          # plugin then copied Cesium to dist/mrai-gods-eye/cesium, so the
          # live URL doubled to /mrai-gods-eye/mrai-gods-eye/cesium.
          # Relative base './' keeps every asset under dist/ and makes all
          # references relative, which works at any subpath.
          npm run build -- --base=./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
